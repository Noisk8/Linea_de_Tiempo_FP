<body>
  <!-- Global SVG filter for hand-drawn sketch border effect -->
  <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden;">
    <defs>
      <!-- Heavy sketchy filter for image-only elements -->
      <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" seed="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- Gentle border-only sketchy filter for text-containing elements -->
      <filter id="sketchy-border" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="4" seed="5" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
  <app-root></app-root>
</body>
