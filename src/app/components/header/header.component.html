<header class="site-header">
  <div class="brand">
    <a routerLink="/" class="brand-logo-link" aria-label="Inicio">
      <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="12" y1="3" x2="12" y2="21"></line>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span class="brand-acronym">PyFC</span>
    </a>
  </div>
  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'HEADER.HOME' | translate
      }}</a>
    <a routerLink="/timeline" routerLinkActive="active">{{ 'HEADER.TIMELINE' | translate }}</a>
    <a routerLink="/notas" routerLinkActive="active">{{ 'HEADER.ABOUT' | translate }}</a>
    <a routerLink="/referencias" routerLinkActive="active">{{ 'HEADER.REFERENCES' | translate }}</a>

    <button class="cmd-trigger" (click)="openCommandPalette()" aria-label="Abrir paleta de comandos">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="cmd-text">{{ 'HEADER.CMD_PALETTE' | translate }}</span>
      <kbd>Ctrl K</kbd>
    </button>
    <button class="lang-toggle" (click)="i18nService.toggleLanguage()" aria-label="Cambiar idioma">
      {{ i18nService.currentLang() | uppercase }}
    </button>
    <button class="theme-toggle" (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDarkMode() ? ('COMMON.TOGGLE_LIGHT' | translate) : ('COMMON.TOGGLE_DARK' | translate)">
      <svg *ngIf="!themeService.isDarkMode()" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" class="icon-moon">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg *ngIf="themeService.isDarkMode()" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" class="icon-sun">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </nav>
</header>
