<div class="palette-overlay" *ngIf="isOpen" (click)="closePalette()">
    <div class="palette-container" (click)="$event.stopPropagation()">

        <div class="palette-header">
            <input #searchInput type="text" class="palette-input" placeholder="Buscar comando" spellcheck="false"
                [value]="searchQuery" (input)="onSearchChange($event)">
        </div>

        <div class="palette-body" *ngIf="filteredCommands.length > 0">
            <ul #resultsList class="palette-results">
                <ng-container *ngFor="let group of groupBy">
                    <li class="palette-group-label">{{ group.category }}</li>
                    <li *ngFor="let cmd of group.cmds" class="palette-item"
                        [class.selected]="selectedIndex === cmd._index" (mouseenter)="setHoverIndex(cmd._index)"
                        (click)="executeCommand(cmd._index)">
                        <!-- Render SVG Icons based on type -->
                        <div class="item-icon">
                            <!-- Actions -->
                            <svg *ngIf="cmd.icon === 'sun'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2"></path>
                                <path d="M12 20v2"></path>
                                <path d="m4.93 4.93 1.41 1.41"></path>
                                <path d="m17.66 17.66 1.41 1.41"></path>
                                <path d="M2 12h2"></path>
                                <path d="M20 12h2"></path>
                                <path d="m6.34 17.66-1.41 1.41"></path>
                                <path d="m19.07 4.93-1.41 1.41"></path>
                            </svg>
                            <svg *ngIf="cmd.icon === 'moon'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                            </svg>
                            <svg *ngIf="cmd.icon === 'globe'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path
                                    d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                </path>
                                <path d="M2 12h20"></path>
                            </svg>
                            <!-- Navigations -->
                            <svg *ngIf="cmd.icon === 'home'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                            <svg *ngIf="cmd.icon === 'clock'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            <svg *ngIf="cmd.icon === 'info'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M12 16v-4"></path>
                                <path d="M12 8h.01"></path>
                            </svg>
                            <svg *ngIf="cmd.icon === 'book'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
                            </svg>
                        </div>

                        <span class="item-label">{{ cmd.label }}</span>
                        <span class="item-shortcut">
                            <kbd *ngFor="let key of cmd.shortcut.split(' ')">{{ key }}</kbd>
                        </span>
                    </li>
                </ng-container>
            </ul>
        </div>

        <div class="palette-empty" *ngIf="filteredCommands.length === 0">
            <p>No se encontraron comandos.</p>
        </div>

        <!-- Footer mimicking the reference image -->
        <div class="palette-footer">
            <div class="shortcut-tip">
                <span><kbd>↵</kbd> seleccionar</span>
            </div>
            <div class="shortcut-tip">
                <span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span>
            </div>
            <div class="shortcut-tip">
                <span><kbd>Esc</kbd> cerrar</span>
            </div>
        </div>
    </div>
</div>
