<section class="hero" aria-labelledby="hero-title">
  <div class="hero-content">
    <p class="eyebrow" @fadeDown>{{ 'HOME.EYEBROW' | translate }}</p>
    <h2 id="hero-title" @fadeLeft>{{ 'HOME.TITLE' | translate }}</h2>
    <p class="lead" @fadeIn>
      {{ 'HOME.LEAD' | translate }}
    </p>
    <a class="cta" routerLink="/timeline" @fadeScale>{{ 'HOME.CTA' | translate }}</a>
  </div>
  <div class="hero-media" @fadeRight>
    <div class="hero-card">
      <img [src]="imageUrl" alt="Presidentes y futbol en Colombia" />
    </div>
  </div>
  <div class="scroll-indicator" aria-hidden="true">
    <span></span>
  </div>
</section>
