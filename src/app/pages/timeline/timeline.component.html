<section class="timeline">
  <div class="dynamic-bg" style="background-image: url('/imagenes/bg/timeline-placeholder.png')"
    [class.bg-loaded]="true"></div>
  <div class="timeline-header">
    <p class="timeline-kicker">{{ 'TIMELINE.KICKER' | translate }}</p>
    <h2>{{ 'TIMELINE.TITLE' | translate }}</h2>
    <p class="timeline-intro">{{ 'TIMELINE.INTRO' | translate }}</p>
    <div class="search-container">
      <input type="text" [placeholder]="'TIMELINE.SEARCH_PLACEHOLDER' | translate" class="search-input"
        (input)="onSearchChange($event)" [value]="searchTerm" />
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </div>
  </div>

  <div class="timeline-wrapper" [style.--timeline-progress]="progressPercent + '%'">
    <div class="timeline-progress"></div>
    <p-timeline [value]="filteredEntries" align="alternate" styleClass="timeline-prime">
      <ng-template pTemplate="opposite" let-entry>
        <span class="timeline-year">{{ entry.termStartYear }}-{{ entry.termEndYear }}</span>
      </ng-template>

      <ng-template pTemplate="content" let-entry>
        <a #timelineCard class="timeline-card" [class.is-loading]="!imageLoaded[entry.id]"
          [attr.href]="'/presidentes/' + entry.id" target="_blank" rel="noopener">
          <div class="timeline-media">
            <img [src]="entry.image" [alt]="entry.name" loading="lazy" decoding="async"
              (load)="onImageLoad(entry.id)" />
          </div>
          <div class="timeline-body">
            <h3
              [innerHTML]="highlightText(i18nService.currentLang() === 'en' && entry.name_en ? entry.name_en : entry.name)">
            </h3>
            <p
              [innerHTML]="highlightText(i18nService.currentLang() === 'en' && entry.paragraphs_en ? entry.paragraphs_en[0] : entry.paragraphs[0])">
            </p>
            <span class="cta">{{ 'TIMELINE.OPEN_DETAIL' | translate }}</span>
          </div>
        </a>
      </ng-template>
    </p-timeline>
  </div>
</section>

<app-scroll-to-top></app-scroll-to-top>
